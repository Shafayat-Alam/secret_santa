<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secret Santa – North Pole HR Edition</title>
  <meta name="description" content="Add your group, roll the dice, find out who you're buying for.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
</head>
<body>

<!-- Background: Santa, freshly fired, holding a box of his desk stuff at the North Pole -->
<svg id="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d2b"/>
      <stop offset=".55" stop-color="#16316b"/>
      <stop offset="1" stop-color="#4a79b8"/>
    </linearGradient>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2cffb0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2cffb0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#b9d0ea"/>
    </linearGradient>
    <pattern id="stripe" width="20" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="20" height="20" fill="#fff"/><rect y="20" width="20" height="20" fill="#d62839"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#fff" opacity=".85">
    <circle cx="60" cy="50" r="1.6"/><circle cx="150" cy="110" r="1.2"/><circle cx="240" cy="40" r="1.8"/>
    <circle cx="330" cy="90" r="1.2"/><circle cx="520" cy="55" r="1.6"/><circle cx="610" cy="120" r="1.2"/>
    <circle cx="700" cy="45" r="1.8"/><circle cx="760" cy="130" r="1.2"/><circle cx="440" cy="30" r="1.2"/>
  </g>
  <circle cx="660" cy="95" r="34" fill="#fffbe0"/><circle cx="672" cy="88" r="30" fill="#16316b" opacity=".18"/>
  <path d="M-20 170 C150 90 280 230 420 140 S 680 80 840 170 L840 260 L-20 260Z" fill="url(#aur)" class="aurora"/>
  <path d="M-20 270 L120 190 L230 260 L330 170 L470 270 L600 200 L720 260 L820 210 L820 400 L-20 400Z" fill="#7d9fcc"/>
  <path d="M-20 320 L90 260 L200 320 L300 250 L430 330 L560 270 L680 330 L820 280 L820 420 L-20 420Z" fill="#a9c3e4"/>
  <!-- ground -->
  <path d="M-20 430 C 150 400 300 440 450 420 S 700 395 820 425 L820 620 L-20 620Z" fill="url(#snow)"/>
  <!-- north pole sign -->
  <g transform="translate(120 250)">
    <rect x="-9" y="0" width="18" height="190" fill="url(#stripe)" stroke="#9a1c2a" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="13" fill="#d62839"/>
    <g transform="rotate(-6)"><rect x="-70" y="22" width="140" height="34" rx="4" fill="#e8d7a8" stroke="#8a6a30" stroke-width="2"/>
    <text x="0" y="45" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#5a3a12">NORTH POLE</text></g>
  </g>
  <!-- little trees -->
  <g fill="#1d5a45"><path d="M700 330 l30 70 h-60z"/><path d="M700 300 l24 55 h-48z"/>
  <path d="M640 360 l22 55 h-44z"/><path d="M640 338 l17 40 h-34z"/></g>
  <g fill="#fff" opacity=".9"><path d="M700 300 l8 14 h-16z"/><path d="M640 338 l6 12 h-12z"/></g>

  <!-- Santa, sad, holding the box -->
  <g transform="translate(470 215)">
    <ellipse cx="0" cy="260" rx="125" ry="14" fill="#7d96b8" opacity=".55"/>
    <!-- legs -->
    <rect x="-52" y="205" width="40" height="52" rx="10" fill="#8a1320"/>
    <rect x="12" y="205" width="40" height="52" rx="10" fill="#8a1320"/>
    <rect x="-60" y="247" width="50" height="16" rx="8" fill="#1b1b1b"/>
    <rect x="10" y="247" width="50" height="16" rx="8" fill="#1b1b1b"/>
    <!-- body -->
    <path d="M-85 215 C -95 110 -60 70 0 70 S 95 110 85 215Z" fill="#d62839"/>
    <rect x="-86" y="150" width="172" height="20" fill="#1b1b1b"/>
    <rect x="-14" y="148" width="28" height="24" rx="3" fill="#f5c542"/><rect x="-7" y="155" width="14" height="10" fill="#1b1b1b"/>
    <!-- head -->
    <circle cx="0" cy="30" r="42" fill="#ffd1b0"/>
    <path d="M-44 36 C -48 100 -20 112 0 112 S 48 100 44 36 C 30 60 -30 60 -44 36Z" fill="#fff"/>
    <circle cx="0" cy="40" r="9" fill="#ffc0a0"/>
    <path d="M-30 52 q30 -14 60 0" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="24" r="4" fill="#222"/><circle cx="15" cy="24" r="4" fill="#222"/>
    <path d="M-24 14 l16 6M24 14 l-16 6" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <path d="M-12 62 q12 -9 24 0" stroke="#d99" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M22 32 q4 10 0 14 q-4 -4 0 -14Z" fill="#7fd0ff"/>
    <!-- hat, drooping -->
    <path d="M-44 14 C -40 -34 20 -44 52 -4 C 80 10 92 40 80 62 C 70 40 50 30 44 14Z" fill="#d62839"/>
    <rect x="-48" y="6" width="96" height="16" rx="8" fill="#fff"/>
    <circle cx="82" cy="64" r="11" fill="#fff"/>
    <!-- box -->
    <g transform="translate(0 135)">
      <path d="M-70 0 L-50 -28 L-20 -20Z" fill="#c79a5b" transform="rotate(-8 -50 -10)"/>
      <path d="M70 0 L50 -28 L20 -20Z" fill="#c79a5b" transform="rotate(8 50 -10)"/>
      <!-- stuff sticking out -->
      <rect x="-40" y="-58" width="26" height="34" rx="4" fill="#fff" stroke="#999"/><path d="M-14 -50 q12 4 0 20" stroke="#999" stroke-width="4" fill="none"/>
      <g transform="translate(14 -66)"><rect x="-3" y="12" width="6" height="30" fill="#6b4a2b"/><ellipse cx="0" cy="8" rx="20" ry="8" fill="#3d9b4f"/><ellipse cx="-10" cy="-2" rx="9" ry="14" fill="#4cc062"/><ellipse cx="10" cy="-4" rx="9" ry="14" fill="#2f8643"/></g>
      <rect x="-82" y="0" width="164" height="110" rx="4" fill="#d9ab6a" stroke="#a97b3d" stroke-width="3"/>
      <rect x="-82" y="0" width="164" height="22" fill="#c79a5b"/>
      <rect x="-16" y="0" width="32" height="42" fill="#efe3c6" opacity=".85"/>
      <text x="0" y="75" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="15" fill="#6b4a1d">SANTA'S STUFF</text>
    </g>
    <!-- hands -->
    <circle cx="-86" cy="205" r="14" fill="#ffd1b0"/><circle cx="86" cy="205" r="14" fill="#ffd1b0"/>
  </g>
</svg>
<div id="snowfall" aria-hidden="true"></div>

<main id="app"><p class="loading">🎅 Packing up the sleigh…</p></main>

<script type="py" src="main.py" config='{"packages": []}'></script>
</body>
</html>
